# Fluxo v2 — deploy de producción (VPS + Supabase MANAGED). El VPS corre SOLO el plano de control:
# console (Next) + worker (conductor) + Caddy (TLS/reverse-proxy). Supabase (Postgres/RLS/Realtime/
# Auth) es managed (cloud, free→pro). La EJECUCIÓN de agentes corre en GitHub Actions con el token
# del CLIENTE (BYO, cero COGS) — el VPS queda chico.
#
#   cd deploy && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# NOTA: NEXT_PUBLIC_* van como BUILD-ARGS del console (Next los inlinea en build) — el compose los
# toma de .env.prod y los pasa como args; el resto son env de runtime.
services:
  console:
    build:
      context: ..
      dockerfile: console/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?falta en .env.prod}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?falta en .env.prod}
    image: fluxo-console
    restart: always
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:?}
      # La private key va como ARCHIVO montado (PEM con newlines reales; el env multilínea no es fiable).
      GITHUB_APP_PRIVATE_KEY_PATH: /app/secret/app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:?}
      # El callback de OAuth que GitHub usa para volver — DEBE ser el dominio público (default del
      # código es localhost). githubAuth.ts lo lee de OAUTH_REDIRECT_URI.
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:?}
      # AI Assistant (P5-1): el console PROXEA al agent-loop del worker (red interna del compose).
      WORKER_ASSISTANT_URL: http://worker:8790
    volumes:
      - ./app.pem:/app/secret/app.pem:ro
    expose:
      - "3000"

  worker:
    build:
      context: ..
      dockerfile: design/Dockerfile
    image: fluxo-worker
    restart: always
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?}
      GITHUB_APP_PRIVATE_KEY_PATH: /app/secret/app.pem
      # Solo para el workflow de DISEÑO (idea→backlog) que corre el agente local; el conductor no lo usa.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # AI Assistant (P5-1): puerto interno del agent-loop (el console proxea acá). No se publica.
      WORKER_HTTP_PORT: "8790"
    volumes:
      - ./app.pem:/app/secret/app.pem:ro
    command: ["node", "--experimental-strip-types", "src/worker.ts", "--interval=20"]

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [console]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # `default` = red del compose (alcanza a console). `preview_ingress` = red compartida con los edges
    # de los previews efímeros (release v2 · docs/14), para rutearles TLS + subdominio sslip.io. Declararla
    # acá la hace durable ante recreates (si no, hay que reconectar a mano — el runner igual la self-healea).
    networks:
      - default
      - preview_ingress

networks:
  preview_ingress:
    external: true
    name: fluxo-preview-ingress

volumes:
  caddy_data:
  caddy_config:
