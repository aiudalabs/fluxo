# registry/stacks/python-fastapi-react.yaml
#
# Manifest del stack (data). Vive FUERA de registry/templates/github-native/<stack>/ a propósito:
# ese árbol lo shippea buildScaffold entero al repo del cliente — un manifest ahí se filtraría al
# repo. Acá declara metadata del stack para Fluxo (ver aiuda-flutter-firebase.yaml para el contrato).
# El template correspondiente vive en registry/templates/github-native/python-fastapi-react/.
id: python-fastapi-react
# label/description: el stack como cosa SELECCIONABLE (data para la UI).
label: Python + React
description: Backend Python/FastAPI + frontend React.
# platform / backend: la FORMA del stack (data, fuente de verdad) que las fases de DISEÑO leen para
# encuadrar su salida. `platform` (mobile|web) dirige el encuadre de UI/mockups: web → layouts de browser
# (top nav, breakpoints responsive). `backend` (firebase|supabase|fastapi) es el PARADIGMA de datos (NO
# solo el store, para no conflacionar supabase vs fastapi): fastapi → Postgres relacional + SQLAlchemy +
# authz en la capa de app (NO RLS en la DB). Hoy el data-modeler/ux/designer lo ESPEJAN en prosa (el agente
# no lee el registry en runtime); una fase futura lo inyecta desde acá sin re-escribir la persona.
platform: web
backend: fastapi
# capabilities — integraciones externas BYO que el stack necesita (registry/capabilities/<id>.yaml).
# El default corre local/emulado (Postgres en prod, SQLite en dev) → sin frontera humana obligatoria.
# [] hoy; sumar capabilities es data, cero código.
capabilities: []
# lanes: el mapeo SUPERFICIE → agente-dev de este stack (data, la FUENTE DE VERDAD del ruteo de
# owner). Claves confirmadas contra el template (registry/templates/github-native/python-fastapi-react/
# CLAUDE.md.tmpl: «Backend paths» = python-dev; «Frontend paths» → `.github/agents/react-web-dev` = web).
# El frontend web va a `react-web-dev` (NO `react-dev`, que es la lane admin de aiuda-flutter-firebase);
# el backend FastAPI va a `python-dev`. El scrum-master asigna el `owner` según ESTE mapeo (hoy espejado
# en su prosa; futura fase lo inyecta desde acá).
lanes:
  backend: python-dev
  web: react-web-dev
