# registry/stacks/react-supabase.yaml
#
# Manifest del stack (data). Vive FUERA de registry/templates/github-native/<stack>/ a propósito:
# ese árbol lo shippea buildScaffold entero al repo del cliente — un manifest ahí se filtraría al
# repo. Acá declara metadata del stack para Fluxo (ver aiuda-flutter-firebase.yaml para el contrato).
# El template correspondiente vive en registry/templates/github-native/react-supabase/.
id: react-supabase
# label/description: el stack como cosa SELECCIONABLE (data para la UI).
label: React + Supabase
description: Web app con backend Supabase (Postgres).
# platform / backend: la FORMA del stack (data, fuente de verdad) que las fases de DISEÑO leen para
# encuadrar su salida. `platform` (mobile|web) dirige el encuadre de UI/mockups: web → layouts de browser
# (top nav, breakpoints responsive). `backend` (firebase|supabase|fastapi) es el PARADIGMA de datos (NO
# solo el store, para no conflacionar supabase vs fastapi): supabase → Postgres relacional + RLS policies
# en la DB. Hoy el data-modeler/ux/designer lo ESPEJAN en prosa (el agente no lee el registry en runtime);
# una fase futura lo inyecta desde acá sin re-escribir la persona.
platform: web
backend: supabase
# capabilities — integraciones externas BYO que el stack necesita (registry/capabilities/<id>.yaml).
# Hoy no hay una capability `supabase` declarada en el registry → [] (degrada limpio: sin frontera
# humana automática). Sumar la capability cuando exista es data, cero código.
capabilities: []
# lanes: el mapeo SUPERFICIE → agente-dev de este stack (data, la FUENTE DE VERDAD del ruteo de
# owner). Claves confirmadas contra el template (registry/templates/github-native/react-supabase/
# CLAUDE.md.tmpl: «the Vite React app (react-web-dev lane)» = web; «the backend (supabase-dev lane)»
# = backend). El frontend web de este stack va a `react-web-dev` (NO `react-dev`, que es la lane admin
# de aiuda-flutter-firebase); el backend Supabase va a `supabase-dev`. El scrum-master asigna el
# `owner` según ESTE mapeo (hoy espejado en su prosa; futura fase lo inyecta desde acá).
lanes:
  web: react-web-dev
  backend: supabase-dev
