# registry/stacks/react-supabase.yaml
#
# Manifest del stack (data). Vive FUERA de registry/templates/github-native/<stack>/ a propósito:
# ese árbol lo shippea buildScaffold entero al repo del cliente — un manifest ahí se filtraría al
# repo. Acá declara metadata del stack para Fluxo (ver aiuda-flutter-firebase.yaml para el contrato).
# El template correspondiente vive en registry/templates/github-native/react-supabase/.
id: react-supabase
# label/description: el stack como cosa SELECCIONABLE (data para la UI).
label: React + Supabase
description: Web app con backend Supabase (Postgres).
# backend: el PARADIGMA de datos del stack (data, fuente de verdad) que la fase de DISEÑO del
# data-modeler lee para modelar el paradigma correcto. `backend` (firebase|supabase|fastapi) NO es solo
# el store (para no conflacionar supabase vs fastapi): supabase → Postgres relacional + RLS policies en la
# DB. Vive a nivel STACK (no en la lane): un stack tiene UN paradigma de backend. El data-modeler lo
# ESPEJA en prosa (el agente no lee el registry en runtime); una fase futura lo inyecta desde acá.
#
# `platform` NO vive acá: es PER-LANE (ver `lanes:` abajo). La plataforma es una propiedad de la SUPERFICIE
# (frontend), no del stack — así un stack multi-superficie framea cada una correctamente.
backend: supabase
# capabilities — integraciones externas BYO que el stack necesita (registry/capabilities/<id>.yaml).
# Hoy no hay una capability `supabase` declarada en el registry → [] (degrada limpio: sin frontera
# humana automática). Sumar la capability cuando exista es data, cero código.
capabilities: []
# lanes: el mapeo SUPERFICIE → { agent, platform? } de este stack (data, la FUENTE DE VERDAD del ruteo de
# owner Y del encuadre de UI/mockups por superficie). Claves confirmadas contra el template
# (registry/templates/github-native/react-supabase/CLAUDE.md.tmpl: «the Vite React app (react-web-dev
# lane)» = web; «the backend (supabase-dev lane)» = backend). `agent` es el id del dev; `platform`
# (mobile|web) lo llevan SOLO las lanes de FRONTEND (web → layouts de browser, top nav, breakpoints); las
# de BACKEND no. El frontend web va a `react-web-dev` (NO `react-dev`, que es la lane admin de
# aiuda-flutter-firebase); el backend Supabase a `supabase-dev`. El scrum-master asigna el `owner` y
# ux/designer el encuadre según ESTE mapeo (hoy espejado en prosa; futura fase lo inyecta desde acá).
# `paths` (por lane): los globs que la lane POSEE — la fuente de verdad del path-ownership que el
# scaffold rinde en CLAUDE.md/AGENTS.md ({{path_map_frontend}} = lanes con `platform`;
# {{path_map_backend}} = las sin `platform`). Confirmados contra el `applyTo:` de cada
# .github/instructions/*.instructions.md.tmpl de este stack.
lanes:
  web: { agent: react-web-dev, platform: web, paths: [src/**, index.html, vite.config.ts] }
  backend: { agent: supabase-dev, paths: [supabase/**] }

# validation_commands: los comandos EXACTOS que la CI corre en cada PR (espejo de
# .github/workflows/test-verify.yml.tmpl) — el bloque {{validation_commands}} de CLAUDE.md/AGENTS.md.
validation_commands: |
  ```bash
  # Instala deps (pnpm / yarn / npm según el lockfile) y corre la suite raíz (workspaces)
  pnpm install --frozen-lockfile && pnpm test
  ```
# design_tokens: el bloque {{design_tokens}} de las instructions de frontend. Los valores concretos los
# fija la fase de DISEÑO por-proyecto y viven en los docs del repo; a nivel stack apuntamos a esos docs.
design_tokens: |
  Los design tokens comprometidos de este producto (paleta, escala tipográfica, spacing, radii,
  sombras) están especificados en `docs/UI_SCREENS.md` (sección de design tokens) y
  `docs/OPINIONATED_DEFAULTS.md`. Aplicá esos valores exactos vía el theme de Tailwind / CSS variables —
  no inventes colores ni tamaños por pantalla; un valor que falte es un gap de diseño para levantar en el issue.
