# registry/stacks/aiuda-flutter-firebase.yaml
#
# Manifest del stack (data). Vive FUERA de registry/templates/github-native/<stack>/ a propósito:
# ese árbol lo shippea buildScaffold entero al repo del cliente — un manifest ahí se filtraría al
# repo. Acá declara metadata del stack para Fluxo. `capabilities:` = qué integraciones externas BYO
# necesita este stack (registry/capabilities/<id>.yaml). Lo consume el onboarding self-serve
# (checklist + semáforos 🟢) y el gate capability-aware (frontera humana; ver docs/06 D8, docs/11 P6-2b).
id: aiuda-flutter-firebase
# label/description: el stack como cosa SELECCIONABLE (data para la UI — selector de "Proyecto
# nuevo", Settings y los chips de filtro del Registry). Español criollo, una línea.
label: Flutter + Firebase
description: Apps móviles iOS/Android con backend Firebase.
# backend: el PARADIGMA de datos del stack (data, fuente de verdad) que la fase de DISEÑO del
# data-modeler lee para modelar el paradigma correcto. `backend` (firebase|supabase|fastapi) NO es
# solo el store (para no conflacionar supabase vs fastapi): firebase → Firestore documental; supabase →
# Postgres relacional + RLS en la DB; fastapi → Postgres relacional + authz en la capa de app. Vive a
# nivel STACK (no en la lane) a propósito: un stack tiene UN paradigma de backend, compartido por todas
# sus superficies (el admin de este stack también habla Firebase). El data-modeler lo ESPEJA en prosa
# (el agente no lee el registry en runtime); una fase futura lo inyecta desde acá sin re-escribir la persona.
#
# `platform` NO vive acá: es PER-LANE (ver `lanes:` abajo). Un stack multi-superficie tiene superficies de
# DISTINTA plataforma —app Flutter (mobile) + admin React (web)— así que una sola `platform` a nivel stack
# framearía MAL el admin (como teléfono). La plataforma es una propiedad de la SUPERFICIE, no del stack.
backend: firebase
capabilities:
  - firebase
# lanes: el mapeo SUPERFICIE → { agent, platform? } de este stack (data, la FUENTE DE VERDAD del ruteo de
# owner Y del encuadre por-superficie de UI/mockups). La clave es la superficie tal como la nombran los
# templates del stack (registry/templates/github-native/aiuda-flutter-firebase/:
# `.github/agents/{flutter,firebase}-dev` + CLAUDE.md.tmpl «the admin (react-dev) lane»); `agent` es el
# `id` del agente del registry que la implementa. El scrum-master asigna el `owner` de cada story según
# ESTE mapeo. `platform` (mobile|web) lo llevan SOLO las lanes de FRONTEND: dirige el encuadre de la
# superficie en ux/designer — mobile → pantallas de teléfono (bottom nav, phone frame ~390px); web →
# layouts de browser (top nav, breakpoints). Las lanes de BACKEND NO llevan platform (no tienen UI). Hoy
# ux/designer/scrum-master lo ESPEJAN en prosa (el agente no lee el registry en runtime); una fase futura
# lo inyecta desde acá sin re-escribir la persona. OJO: la lane `admin` (React Firebase-integrated) es
# `platform: web` aunque el stack sea "de apps móviles" — es un portal admin de browser; framearlo como
# teléfono es el bug que este esquema per-lane arregla. `react-dev` acá es SOLO la lane admin, NUNCA el
# frontend web genérico — ese es `react-web-dev` (ver react-supabase.yaml / python-fastapi-react.yaml).
# `paths` (por lane): los globs que la lane POSEE — la fuente de verdad del path-ownership que el
# scaffold rinde en CLAUDE.md/AGENTS.md ({{path_map_frontend}} = unión de las lanes con `platform`;
# {{path_map_backend}} = las sin `platform`). Confirmados contra el `applyTo:` de cada
# .github/instructions/*.instructions.md.tmpl de este stack. Una lane sin `paths` no aporta al
# path-map (degradación limpia).
lanes:
  mobile: { agent: flutter-dev, platform: mobile, paths: [apps/**, packages/**] }
  backend: { agent: firebase-dev, paths: [functions/**, packages-ts/**, firestore.rules, firestore.indexes.json, database.rules.json, storage.rules] }
  admin: { agent: react-dev, platform: web, paths: [admin/**] }

# validation_commands: los comandos EXACTOS que la CI corre en cada PR (espejo de
# .github/workflows/test-verify.yml.tmpl de este stack) — el bloque {{validation_commands}} de
# CLAUDE.md/AGENTS.md. Se rinde verbatim (fenced code) donde el template pone el gate.
validation_commands: |
  ```bash
  # Flutter — en cada paquete con carpeta test/ (apps + packages)
  flutter pub get && flutter test
  # Cloud Functions (Node 20 + TypeScript)
  cd functions && npm ci && npm test
  ```
# design_tokens: el bloque {{design_tokens}} de las instructions de frontend (app.instructions). Los
# valores concretos (paleta, tipografía, spacing, radii) los fija la fase de DISEÑO por-proyecto y
# viven en los docs del repo; a nivel stack apuntamos al agente a esos docs (degradación honesta: sin
# tokens per-proyecto en el manifest, no inventamos hex codes).
design_tokens: |
  Los design tokens comprometidos de este producto (paleta, escala tipográfica, spacing, radii,
  sombras) están especificados en `docs/UI_SCREENS.md` (sección de design tokens) y
  `docs/OPINIONATED_DEFAULTS.md`. Aplicá esos valores exactos vía `ThemeData` + `google_fonts` — no
  inventes colores ni tamaños por pantalla; un valor que falte es un gap de diseño para levantar en el issue.
# app_path: la app Flutter PRIMARIA (dir con `pubspec.yaml`) que la CI buildea/verifica — el bloque
# {{app_path}} de ui-verify/build-apk/deploy/device-verify (es el `working-directory` de `flutter build`).
# SIN esto, esos 4 workflows —incluido `ui-verify.yml`, el gate VISUAL del art-director— se saltean en el
# scaffold (var sin resolver) y el repo del cliente queda SIN verificación de UI. MULTI-APP (v1): se buildea
# SOLO la app primaria; la convención del monorepo aiuda (espejo de la lane `mobile` + la persona
# flutter-dev) ubica la app cliente en `apps/customer`. Los workflows guardan con
# `hashFiles('<app_path>/pubspec.yaml')` → si un proyecto la ubica en otro dir, degradan limpio (skip, no
# rompen). Una fase futura lo derivará del ARCHITECTURE.md por-proyecto; hoy es la convención del stack.
app_path: apps/customer
