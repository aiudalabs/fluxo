# Fluxo CI (F0-03). Every job delegates to scripts/ci.sh <stage> so local dev and
# CI run the exact same checks — no drift. Stages skip cleanly until their
# artifacts land (migrations F1-01, cross-tenant leak F1-05/F2-04, console F6);
# a skip is always announced, never silent (docs/04-lecciones L-AUTO-3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    name: registry (method-as-data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: scripts/ci.sh registry

  control:
    name: control (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - run: scripts/ci.sh control

  database:
    name: db (migrations + cross-tenant leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` applies every migration (a migration smoke test) on a
      # Supabase-capable Postgres — needed because our schema uses Supabase
      # primitives (authenticated/anon roles, auth.jwt(), supabase_realtime).
      # A plain postgres:17 cannot apply it. Excluded services aren't needed for
      # DB tests (and some are flaky in CI); this list may want a first-run tweak.
      - name: Start Supabase (smoke-applies migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,postgres-meta,supavisor
      - name: pgTAP incl. cross-tenant leak (blocking)
        run: scripts/ci.sh db
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  console:
    name: console (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/ci.sh console

  design:
    name: design (Agent SDK runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/ci.sh design
